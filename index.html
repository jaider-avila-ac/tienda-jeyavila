    <!-- Si ya hay una copia guardada de los banners (ver src/services/bannerService.js), empieza a
         descargar el primero desde ya, en paralelo al JavaScript, para que esté listo cuando la
         portada se pinte y no aparezca "de golpe". -->
    <script>
      (function () {
        try {
          var b = JSON.parse(localStorage.getItem('banners:v1:hero'));
          var u = b && b[0] && b[0].tipo !== 'video' && b[0].url;
          if (u) {
            var l = document.createElement('link');
            l.rel = 'preload';
            l.as = 'image';
            l.href = u;
            document.head.appendChild(l);
          }
        } catch (e) {}
      })();
    </script>
